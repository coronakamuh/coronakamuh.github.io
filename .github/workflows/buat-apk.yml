name: Buat APK Android

# Dijalankan manual: Actions > Buat APK Android > Run workflow.
# Hanya membuat file APK (artifact); tidak men-deploy situs dan tidak mengubah package.json.
# Capacitor dan plugin dipasang sementara di dalam workflow ini saja (tidak di-commit).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "langsung = memuat situs dari internet (situs berubah tanpa pasang ulang APK); salinan = situs dibundel di dalam APK"
        type: choice
        options:
          - langsung
          - salinan
        default: langsung

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependensi (sesuai package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Build web
        run: npm run build

      # Tanpa --no-save: plugin harus tercatat di package.json milik runner ini (sementara, tidak di-commit)
      # agar `cap sync` mengenalinya.
      - name: Pasang Capacitor dan plugin sementara
        run: npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/filesystem@^7 @capacitor/share@^7

      # Mode langsung: aplikasi membuka https://coronakamuh.github.io di WebView (hanya di runner, tidak di-commit).
      - name: Atur mode APK
        if: ${{ inputs.mode != 'salinan' }}
        run: |
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.server={...c.server,url:'https://coronakamuh.github.io',allowNavigation:['coronakamuh.github.io']};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          cat capacitor.config.json

      - name: Buat proyek Android dan sinkronkan hasil build
        run: |
          npx cap add android
          npx cap sync android

      - name: Pasang ikon dan splash
        run: sh apk-aset/terapkan.sh

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: solusi-rumah-idaman-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
