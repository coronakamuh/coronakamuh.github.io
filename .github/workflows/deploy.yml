name: Build dan deploy

# Setiap push menjalankan build untuk memastikan aplikasi tidak error.
# Deploy ke GitHub Pages hanya berjalan untuk branch main, dan hanya bila build berhasil.
# Yang diunggah adalah folder dist (hasil build), bukan file sumber.
# Pengaturan repository: Settings > Pages > Source harus "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependensi (sesuai package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Periksa hasil build
        run: |
          test -f dist/index.html
          ls dist/assets/*.js >/dev/null
          if grep -q "/src/main.jsx" dist/index.html; then
            echo "dist/index.html masih menunjuk ke file sumber."; exit 1
          fi

      - name: Siapkan hasil build untuk GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
