<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Terapkan tema tersimpan sebelum halaman digambar, supaya tidak berkedip terang saat memuat.
      (function () {
        try {
          var theme = 'terang'
          try {
            var saved = JSON.parse(localStorage.getItem('dhouse.prefs'))
            if (saved && (saved.theme === 'gelap' || saved.theme === 'sistem' || saved.theme === 'terang')) theme = saved.theme
            if (saved && /^(navy|zamrud|indigo|oranye|grafit|maroon)$/.test(saved.accent)) document.documentElement.setAttribute('data-accent', saved.accent)
          } catch (e) {}
          var dark = theme === 'gelap' || (theme === 'sistem' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.setAttribute('data-theme', dark ? 'gelap' : 'terang')
          root.style.colorScheme = dark ? 'dark' : 'light'
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131c2e')
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="Dhouse Digital: aplikasi pencatatan penjualan, barang, stok, mutasi, dan laporan."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dhouse Digital</title>
    <script>
      // Bila aplikasi gagal tampil, tulis pesan error di layar (bukan layar kosong).
      (function () {
        var msgs = []
        function render() {
          var root = document.getElementById('root')
          if (root && root.childNodes.length) return
          var box = document.getElementById('diag')
          if (!box) {
            box = document.createElement('pre')
            box.id = 'diag'
            box.style.cssText = 'white-space:pre-wrap;word-break:break-word;padding:16px;margin:0;font:13px/1.5 monospace;color:var(--color-bahaya,#b42318)'
            document.body.appendChild(box)
          }
          box.textContent = 'Dhouse Digital gagal tampil.\n\n' + msgs.join('\n')
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          msgs.push(t && (t.src || t.href) ? 'Gagal memuat: ' + (t.src || t.href) : 'Error: ' + e.message + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''))
          setTimeout(render, 50)
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          msgs.push('Error: ' + ((e.reason && e.reason.message) || e.reason))
          setTimeout(render, 50)
        })
        setTimeout(function () {
          if (!msgs.length) msgs.push('Tidak ada pesan error.')
          render()
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
